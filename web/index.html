<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Talia Dahan Travel — חופשות בוטיק מאורגנות לדובאי ואבו דאבי, עם ליווי אישי וקבוצה איכותית." />
    <meta name="theme-color" content="#F7F3EA" />
    <link rel="icon" href="/assets/logo.jpeg" type="image/jpeg" />
    <link rel="shortcut icon" href="/assets/logo.jpeg" type="image/jpeg" />
    <title>Talia Dahan Travel</title>
  </head>
  <body>
    <div id="root"></div>
    <form name="talia-trip-registration-main" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="talia-trip-registration-main" />
      <input name="bot-field" />
      <input name="name" />
      <input name="lastName" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <input name="privacyConsent" type="checkbox" value="accepted" />
    </form>
    <form name="talia-trip-registration-final" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="talia-trip-registration-final" />
      <input name="bot-field" />
      <input name="name" />
      <input name="lastName" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <input name="privacyConsent" type="checkbox" value="accepted" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
